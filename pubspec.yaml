name: health_analyzer
description: "Health data analyzer - collects data from Xiaomi Smart Band via Health Connect and pushes to Turso"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Health Connect
  health: 13.1.3

  # HTTP client
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Background tasks
  workmanager: ^0.7.0

  # Local database (offline-first)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Connectivity detection
  connectivity_plus: ^6.1.0

  # Secure storage (API keys, tokens)
  flutter_secure_storage: ^9.2.2

  # File paths
  path_provider: ^2.1.5
  path: ^1.9.1

  # JSON serialization
  json_annotation: ^4.9.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.3
  uuid: ^4.5.3
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_map_tile_caching: 10.1.1
  flutter_map_dragmarker: 8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.1
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
